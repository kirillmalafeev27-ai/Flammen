<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flammen — Fire Demo (Photons2)</title>
    <script type="importmap">
        {
            "imports": {
                "three": "./lib/three.module.js"
            }
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050208;
            color: #f5e6c8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
        }
        #root {
            position: absolute;
            inset: 0;
        }
        #info {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 140, 50, 0.35);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            pointer-events: none;
            backdrop-filter: blur(6px);
            max-width: 280px;
        }
        #info b {
            color: #ffb35a;
        }
        #info .hint {
            opacity: 0.7;
            font-size: 11px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="info">
        <div><b>Flammen</b> — Fire Demo</div>
        <div>Powered by <b>Photons2</b> particle system + Three.js</div>
        <div class="hint">Drag to orbit · Scroll to zoom</div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
